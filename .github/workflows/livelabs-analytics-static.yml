name: LiveLabs Analytics static validation

on:
  pull_request:
    paths:
      - "livelabs-analytics/**"
      - ".github/workflows/livelabs-analytics-static.yml"
  push:
    paths:
      - "livelabs-analytics/**"
      - ".github/workflows/livelabs-analytics-static.yml"

permissions:
  contents: read

jobs:
  validate-static-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: livelabs-analytics

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: livelabs-analytics/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: npm ci

      - name: Check data and release builders
        run: |
          python -B scripts/reconcile-data-confidence.py --help
          python -B scripts/build-static-data.py --help
          node --check scripts/build-static-release.mjs

      - name: Build isolated static release
        run: npm run build:release:ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start isolated review server
        run: |
          npx http-server .ci-release -a 127.0.0.1 -p 4175 > /tmp/livelabs-analytics-http.log 2>&1 &
          npx wait-on http://127.0.0.1:4175/

      - name: Run validator
        env:
          DASHBOARD_URL: http://127.0.0.1:4175
        run: npm run validate

      - name: Run Playwright regression
        env:
          DASHBOARD_URL: http://127.0.0.1:4175
        run: npm run test:browser

      - name: Run Object Storage preflight
        run: npm run preflight:ci

      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livelabs-analytics-playwright-report
          path: livelabs-analytics/playwright-report
          if-no-files-found: ignore
